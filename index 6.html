<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fatima’s Writing Game</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Comic Sans MS","Trebuchet MS",Arial,sans-serif;background:linear-gradient(#bfe9ff,#fff6c9);min-height:100vh;text-align:center;color:#3b2a6b;touch-action:manipulation}
h1{margin:10px 8px 4px;font-size:26px}
#stars{font-size:22px;min-height:30px}
#menu{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:8px}
.tile{width:64px;height:64px;border-radius:16px;border:3px solid #7c5cff;background:#fff;font:bold 34px "Comic Sans MS",Arial,sans-serif;color:#7c5cff;position:relative;cursor:pointer}
.tile.on{background:#7c5cff;color:#fff}
.tile.done::after{content:"⭐";position:absolute;right:-6px;top:-10px;font-size:20px}
#say{font-size:20px;margin:4px 10px;min-height:28px;font-weight:bold}
#pic{font-size:34px;min-height:44px}
#board{position:relative;width:min(86vw,330px);aspect-ratio:300/420;margin:6px auto;background:#fff;border:4px solid #ffb703;border-radius:20px;box-shadow:0 6px 0 #f0a000;overflow:hidden;touch-action:none}
#board canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#dots{font-size:26px;letter-spacing:6px;margin:4px}
.btn{font:bold 20px "Comic Sans MS",Arial,sans-serif;padding:12px 20px;margin:4px;border:0;border-radius:30px;background:#ff6fa5;color:#fff;box-shadow:0 4px 0 #d94a82;cursor:pointer}
.btn.g{background:#2bb673;box-shadow:0 4px 0 #1c8a54}
.btn.b{background:#3a86ff;box-shadow:0 4px 0 #2563c9}
#win{position:fixed;inset:0;background:rgba(255,255,255,.93);display:none;flex-direction:column;align-items:center;justify-content:center;font-size:30px;z-index:9}
#win.show{display:flex}
.foot{font-size:12px;margin:10px;font-style:italic}

.nav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:6px 8px}
.nav button{font:bold 15px "Comic Sans MS",Arial,sans-serif;padding:9px 12px;border-radius:22px;border:3px solid #3a86ff;background:#fff;color:#3a86ff;cursor:pointer}
.nav button.on{background:#3a86ff;color:#fff}
#act{padding:6px}
.aq{font-size:22px;font-weight:bold;margin:8px}
.prog{font-size:24px;letter-spacing:4px}
.opt{min-width:92px;min-height:92px;border-radius:20px;border:4px solid #7c5cff;background:#fff;font:bold 54px "Comic Sans MS",Arial,sans-serif;color:#3b2a6b;margin:8px;padding:6px 12px;cursor:pointer}
.opt small{display:block;font-size:16px}
.opt.grp{font-size:30px;line-height:1.1;max-width:160px}
.opt.sel{background:#ffe8a3}.opt.ok{background:#c9f5d9;border-color:#2bb673}
.opt.bad{border-color:#e63946;animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.cols{display:flex;justify-content:center;gap:28px}.cols>div{display:flex;flex-direction:column}
.big{font-size:44px;max-width:340px;margin:6px auto;line-height:1.25}
.sw{display:inline-block;width:56px;height:56px;border-radius:50%;border:2px solid #333;vertical-align:middle}
</style>
</head>
<body>
<h1>✏️ Fatima’s Writing Game</h1>
<div class="nav">
<button data-m="trace" class="on">✏️ Trace</button><button data-m="pairs">🔢 Match numbers</button><button data-m="count">👀 Count</button><button data-m="odd">🕵️ Odd one out</button><button data-m="lp">🔤 Letter ↔ picture</button><button data-m="sound">👂 Letter sounds</button><button data-m="colors">🎨 Colors</button><button data-m="shapes">🔷 Shapes</button><button data-m="order">🔢 Number order</button>
</div>
<div id="trace">
<div id="stars"></div>
<div id="menu"></div>
<div id="say"></div>
<div id="pic"></div>
<div id="board"><canvas id="g" width="300" height="420"></canvas><canvas id="u" width="300" height="420"></canvas></div>
<div id="dots"></div>
<button class="btn" onclick="clr()">🔄 Try again</button>
<button class="btn b" onclick="hear()">🔊 Listen</button>
<button class="btn g" id="nx" onclick="nextOne()" style="display:none">Next ▶</button>
</div>
<div id="act" style="display:none"></div>
<div id="win"><div>🎉🌟🎉</div><div>Well done, Fatima!</div><br><button class="btn g" onclick="document.getElementById('win').classList.remove('show')">Play again</button></div>
<div class="foot">Created by T.Badria Alfalahi</div>
<script>
const G={
 m:{p:["M20 50 L20 110","M20 70 C20 45 48 45 48 70 L48 110","M48 70 C48 45 76 45 76 70 L76 110"],t:"m",s:"mmm. mmm. mouse.",e:"🐭",w:"m is for mouse",need:3},
 d:{p:["M72 70 C72 52 58 46 46 50 C30 56 26 80 34 96 C42 112 66 112 72 96","M72 20 L72 112"],t:"d",s:"duh. duh. duck.",e:"🦆",w:"d is for duck",need:3},
 1:{p:["M28 45 L52 25 L52 115"],t:"1",s:"one",e:"🍎",w:"one apple",need:1},
 2:{p:["M25 50 C25 15 75 15 75 50 C75 70 40 90 25 115 L78 115"],t:"2",s:"two",e:"🍎",w:"two apples",need:1},
 3:{p:["M28 30 C55 10 78 40 48 62 C85 72 78 118 24 104"],t:"3",s:"three",e:"🍎",w:"three apples",need:1},
 4:{p:["M62 115 L62 25 L22 85 L80 85"],t:"4",s:"four",e:"🍎",w:"four apples",need:1},
 5:{p:["M72 28 L32 28 L28 62 C60 50 82 70 72 95 C62 118 38 112 26 102"],t:"5",s:"five",e:"🍎",w:"five apples",need:1}
};
const order=["m","d","1","2","3","4","5"],count={},done={};
let cur="m",drawing=false,strokes=0,ok=false;
const g=document.getElementById("g"),u=document.getElementById("u"),gx=g.getContext("2d"),ux=u.getContext("2d");
const S=3;
function say(t){try{speechSynthesis.cancel();const x=new SpeechSynthesisUtterance(t);x.lang="en-US";x.rate=.8;x.pitch=1.2;speechSynthesis.speak(x);}catch(e){}}
function hear(){isNaN(cur)?sound(cur):say(G[cur].s)}
function menu(){
 const m=document.getElementById("menu");m.innerHTML="";
 order.forEach(k=>{const b=document.createElement("button");b.className="tile"+(k===cur?" on":"")+(done[k]?" done":"");b.textContent=G[k].t;b.onclick=()=>load(k);m.appendChild(b);});
 document.getElementById("stars").textContent="⭐".repeat(Object.keys(done).length)+"☆".repeat(order.length-Object.keys(done).length);
}
function load(k){
 cur=k;count[k]=count[k]||0;ok=false;
 document.getElementById("nx").style.display="none";
 const d=G[k];
 document.getElementById("say").textContent="Trace the "+(isNaN(k)?"letter":"number")+" “"+d.t+"”. Start at the green dot!";
 document.getElementById("pic").textContent=d.w+" "+(isNaN(k)?d.e:d.e.repeat(+k));
 menu();dots();clr();hear();
}
function dots(){const d=G[cur];document.getElementById("dots").textContent="⭐".repeat(count[cur])+"○".repeat(Math.max(0,d.need-count[cur]));}
function paths(c,lw){G[cur].p.forEach(p=>{c.stroke(new Path2D(p));});}
function clr(){
 ux.setTransform(1,0,0,1,0,0);ux.clearRect(0,0,300,420);strokes=0;ok=false;
 gx.setTransform(S,0,0,S,0,0);gx.clearRect(0,0,100,140);
 gx.strokeStyle="#cfd6e4";gx.lineWidth=9;gx.lineCap="round";gx.setLineDash([.1,7]);paths(gx);
 gx.setLineDash([]);
 G[cur].p.forEach((p,i)=>{const m=p.match(/M(\d+) (\d+)/);gx.beginPath();gx.arc(+m[1],+m[2],6,0,7);gx.fillStyle=i?"#3a86ff":"#2bb673";gx.fill();gx.fillStyle="#fff";gx.font="bold 8px Arial";gx.textAlign="center";gx.textBaseline="middle";gx.fillText(i+1,+m[1],+m[2]+.5);});
}
function pos(e){const r=u.getBoundingClientRect();return[(e.clientX-r.left)*300/r.width,(e.clientY-r.top)*420/r.height];}
u.addEventListener("pointerdown",e=>{if(ok)return;drawing=true;u.setPointerCapture(e.pointerId);const[x,y]=pos(e);ux.strokeStyle="#ff6fa5";ux.lineWidth=14;ux.lineCap="round";ux.lineJoin="round";ux.beginPath();ux.moveTo(x,y);ux.lineTo(x+.1,y);ux.stroke();e.preventDefault();});
u.addEventListener("pointermove",e=>{if(!drawing)return;const[x,y]=pos(e);ux.lineTo(x,y);ux.stroke();ux.beginPath();ux.moveTo(x,y);e.preventDefault();});
function up(){if(!drawing)return;drawing=false;strokes++;judge();}
u.addEventListener("pointerup",up);u.addEventListener("pointercancel",up);
function mask(lw){
 const m=document.createElement("canvas");m.width=300;m.height=420;const c=m.getContext("2d");
 c.setTransform(S,0,0,S,0,0);c.strokeStyle="#000";c.lineWidth=lw;c.lineCap="round";paths(c);
 return c.getImageData(0,0,300,420).data;
}
function judge(){
 const a=mask(5),w=mask(13),b=ux.getImageData(0,0,300,420).data;
 let mk=0,cov=0,ink=0,out=0;
 for(let i=3;i<a.length;i+=4){const inm=a[i]>0,inu=b[i]>0;if(inm)mk++;if(inu)ink++;if(inm&&inu)cov++;if(inu&&!(w[i]>0))out++;}
 const c1=cov/mk,st=out/Math.max(1,ink);
 if(c1>.6&&st<.25){win();}
 else if(strokes>=G[cur].p.length){document.getElementById("say").textContent="Almost! Press “Try again” 💪";}
 else document.getElementById("say").textContent="Good! Keep going…";
}
function win(){
 ok=true;count[cur]++;dots();
 const d=G[cur];
 if(count[cur]>=d.need){done[cur]=true;}
 menu();
 document.getElementById("say").textContent="⭐ Great job, Fatima! ⭐";
 say("Great job, Fatima!");
 if(Object.keys(done).length===order.length){setTimeout(()=>{document.getElementById("win").classList.add("show");say("Well done, Fatima! You finished everything!");},1400);return;}
 const nx=document.getElementById("nx");nx.style.display="inline-block";
 nx.textContent=count[cur]<d.need?"Again ↻":"Next ▶";
}
function nextOne(){
 if(count[cur]<G[cur].need){load(cur);return;}
 const i=order.indexOf(cur);let n=order.slice(i+1).concat(order.slice(0,i)).find(k=>!done[k]);load(n||cur);
}

let sndTok=0;
function playSnd(l,cb){
 let fell=false;const go=()=>{if(fell)return;fell=true;const b=new Audio(EMB[l]);b.onended=cb;b.onerror=cb;b.play().catch(cb);};
 const a=new Audio("sounds/"+l+".mp3");a.onended=cb;a.onerror=go;a.play().catch(go);
}
function sound(l){
 const t=++sndTok;try{speechSynthesis.cancel();}catch(e){}
 playSnd(l,()=>setTimeout(()=>{if(t!==sndTok)return;playSnd(l,()=>setTimeout(()=>{if(t!==sndTok)return;say(PIC[l][1]);},400));},600));
}
function setMode(m){
 aMode=m;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
 document.getElementById("trace").style.display=m==="trace"?"block":"none";
 ACT.style.display=m==="trace"?"none":"block";
 if(m==="trace")load(cur);else{aq=0;asc=0;nextQ();}
}
document.querySelector(".nav").onclick=e=>{const b=e.target.closest("button");if(b)setMode(b.dataset.m);};
const opts=(arr)=>arr.map(o=>`<button class="opt" data-ok="${o.ok?1:0}">${o.t}</button>`).join("");
function nextQ(){
 aLock=false;aTry=0;aSel=null;aDone=0;
 const N=(aMode==="pairs"||aMode==="lp"||aMode==="order")?3:5;
 if(aq>=N){ACT.innerHTML=`<h2>🎉 ${asc} / ${N} ⭐</h2><p class="aq">Great job, Fatima!</p><button class="btn g" data-act="again">Play again</button>`;say("Great job, Fatima!");return;}
 let body="",prompt="";
 if(aMode==="pairs"){
  const ns=shuf([1,2,3,4,5]).slice(0,3);prompt="Match each number with the things.";
  const em={};ns.forEach(n=>em[n]=rnd(EM));
  body=`<div class="cols"><div>${shuf(ns).map(n=>`<button class="opt" data-s="L" data-k="${n}">${n}</button>`).join("")}</div><div>${shuf(ns).map(n=>`<button class="opt grp" data-s="R" data-k="${n}">${em[n].repeat(n)}</button>`).join("")}</div></div>`;
 }else if(aMode==="lp"){
  const ls=shuf([rnd(["m","d"])].concat(shuf(LET.filter(l=>l!=="m"&&l!=="d")).slice(0,2)));prompt="Match each letter with its picture. Tap a letter to hear it.";
  body=`<div class="cols"><div>${ls.map(l=>`<button class="opt" data-s="L" data-k="${l}">${l}</button>`).join("")}</div><div>${shuf(ls).map(l=>`<button class="opt" data-s="R" data-k="${l}">${PIC[l][0]}<small>${PIC[l][1]}</small></button>`).join("")}</div></div>`;
 }else if(aMode==="count"){
  const n=1+Math.floor(Math.random()*5),e=rnd(EM);prompt="How many? Count and tap the number.";
  const o=shuf([n].concat(shuf([1,2,3,4,5].filter(x=>x!==n)).slice(0,2))).map(x=>({t:x,ok:x===n}));
  body=`<div class="big">${e.repeat(n)}</div>${opts(o)}`;
 }else if(aMode==="odd"){
  const sets=[["m","d"],["d","m"],["m","n"],["b","d"],["p","b"],["3","5"],["1","2"],["4","2"],["🍎","🐟"],["🐭","🦆"],["⭐","🎈"]],s=rnd(sets);
  prompt="Which one is different? Tap the odd one out.";
  body=opts(shuf([{t:s[0]},{t:s[0]},{t:s[0]},{t:s[1],ok:1}]));
 }else if(aMode==="colors"){
  const ks=Object.keys(COL),c=rnd(ks);prompt="Tap the color "+c+".";
  const o=shuf([c].concat(shuf(ks.filter(x=>x!==c)).slice(0,2))).map(x=>({t:`<span class="sw" style="background:${COL[x]}"></span>`,ok:x===c}));
  body=`<div class="big" style="font-weight:bold">${c}</div>${opts(o)}`;
 }else if(aMode==="shapes"){
  const ks=Object.keys(SH),c=rnd(ks);prompt="Tap the "+c+".";
  const o=shuf([c].concat(shuf(ks.filter(x=>x!==c)).slice(0,2))).map(x=>({t:SH[x],ok:x===c}));
  body=`<div class="big" style="font-weight:bold">${c}</div>${opts(o)}`;
 }else if(aMode==="order"){
  prompt="Tap the numbers in order: 1, 2, 3, 4, 5.";
  body=shuf([1,2,3,4,5]).map(n=>`<button class="opt" data-n="${n}">${n}</button>`).join("");
 }else{
  aLet=rnd(LET.filter(l=>l==="m"||l==="d"||Math.random()<.5));prompt="Listen. Which letter makes this sound?";
  const o=shuf([aLet].concat(shuf(LET.filter(l=>l!==aLet)).slice(0,2))).map(x=>({t:x,ok:x===aLet}));
  body=`<button class="btn b" data-act="snd" style="font-size:36px">🔊 Listen</button><br>${opts(o)}`;
  setTimeout(()=>sound(aLet),400);
 }
 aPrompt=prompt;
 ACT.innerHTML=`<div class="prog">${"⭐".repeat(asc)}${"○".repeat(N-asc)}</div><div class="aq">${prompt} <button class="btn b" data-act="snd">🔊</button></div>${body}`;
 if(aMode!=="sound")say(prompt);
}
function cheer(){say(rnd(["Great job, Fatima!","Well done!","Super!","Yes!"]));}
ACT.onclick=e=>{
 const t=e.target.closest("button");if(!t||aLock)return;
 const a=t.dataset.act;
 if(a==="again"){setMode(aMode);return;}
 if(a==="snd"){aMode==="sound"?sound(aLet):say(aPrompt);return;}
 if(t.dataset.s){
  if(t.classList.contains("ok"))return;
  if(t.dataset.s==="L"){ACT.querySelectorAll('[data-s="L"]').forEach(x=>x.classList.remove("sel"));t.classList.add("sel");aSel=t;if(aMode==="lp")sound(t.dataset.k);}
  else if(aSel){
   if(aSel.dataset.k===t.dataset.k){aSel.classList.remove("sel");aSel.classList.add("ok");t.classList.add("ok");aSel=null;aDone++;cheer();
    if(aDone===3){aLock=true;asc++;aq++;setTimeout(nextQ,1400);}}
   else{t.classList.add("bad");setTimeout(()=>t.classList.remove("bad"),500);say("Try again");}
  }
  return;
 }
 if(t.dataset.n){
  if(t.classList.contains("ok"))return;const n=+t.dataset.n;
  if(n===aDone+1){t.classList.add("ok");aDone++;say(String(n));if(aDone===5){aLock=true;asc++;aq++;setTimeout(()=>{cheer();setTimeout(nextQ,900);},700);}}
  else{t.classList.add("bad");setTimeout(()=>t.classList.remove("bad"),500);say("Try again");}
  return;
 }
 if(t.dataset.ok==="1"){t.classList.add("ok");aLock=true;if(aTry===0)asc++;aq++;cheer();setTimeout(nextQ,1300);}
 else if(t.dataset.ok==="0"){aTry++;t.classList.add("bad");say("Try again");}
};
load("m");
</script>
